<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#060608;font-family:'Segoe UI',system-ui,sans-serif}
#stage{position:relative;width:1080px;height:1920px;background:linear-gradient(160deg,#060608 0%,#0D0D14 40%,#101020 70%,#060608 100%);overflow:hidden}

/* ===== ANIMATED BG MESH ===== */
.mesh{position:absolute;width:100%;height:100%;opacity:.35;pointer-events:none}
.mesh::before{content:'';position:absolute;width:900px;height:900px;left:-200px;top:-200px;
  background:radial-gradient(circle,rgba(10,132,255,.25) 0%,transparent 65%);
  border-radius:50%;animation:drift1 12s ease-in-out infinite alternate}
.mesh::after{content:'';position:absolute;width:800px;height:800px;right:-250px;bottom:-150px;
  background:radial-gradient(circle,rgba(255,214,10,.1) 0%,transparent 65%);
  border-radius:50%;animation:drift2 15s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(120px,80px) scale(1.15)}}
@keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(-100px,-60px) scale(1.1)}}

/* floating particles */
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(10,132,255,.6);pointer-events:none}
.particle:nth-child(odd){background:rgba(255,214,10,.4)}

/* ===== SCENE SYSTEM ===== */
.scene{position:absolute;width:100%;height:100%;opacity:0;pointer-events:none}
.scene.active{opacity:1;pointer-events:auto}

/* ===== HOOK (scene 0) ===== */
#s0 .hook-line{position:absolute;left:50%;transform:translateX(-50%);text-align:center;
  font-weight:900;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.8);
  opacity:0;letter-spacing:-2px}
#s0 .hook-line span{display:inline-block;animation:letterIn .6s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes letterIn{from{opacity:0;transform:translateY(80px) scale(.3) rotateX(-90deg)}to{opacity:1;transform:translateY(0) scale(1) rotateX(0)}}
#s0 .h1{top:280px;font-size:72px}
#s0 .h2{top:400px;font-size:160px;color:#FFD60A}
#s0 .h3{top:580px;font-size:130px;color:#FFD60A}
#s0 .hsub{top:800px;font-size:44px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:6px;text-transform:uppercase}
#s0 .phone{position:absolute;left:50%;top:880px;width:380px;height:700px;transform:translateX(-50%) perspective(800px) rotateY(0deg) rotateX(2deg);
  border-radius:28px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 40px rgba(10,132,255,.15);
  opacity:0}
#s0 .phone img{width:100%;height:100%;object-fit:cover;object-position:top}
#s0 .accent-bar{position:absolute;left:50%;top:774px;width:0;height:5px;background:#0A84FF;border-radius:3px;
  box-shadow:0 0 20px rgba(10,132,255,.6);transform:translateX(-50%)}

/* ===== APP SHOT (scenes 1-5) ===== */
.app-container{position:absolute;left:50%;top:180px;width:460px;height:810px;
  transform:translateX(-50%) perspective(900px) rotateY(0deg) rotateX(1deg);
  border-radius:32px;overflow:hidden;
  box-shadow:0 40px 80px rgba(0,0,0,.7),0 0 50px rgba(10,132,255,.12),inset 0 1px 0 rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.06)}
.app-container img{width:100%;height:100%;object-fit:cover;object-position:top}

/* PC container */
.pc-container{position:absolute;left:50%;top:280px;width:860px;height:480px;
  transform:translateX(-50%) perspective(600px) rotateX(2deg);
  border-radius:18px;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.8),0 0 60px rgba(10,132,255,.08);
  border:1px solid rgba(255,255,255,.05)}
.pc-container img{width:100%;height:100%;object-fit:cover}

/* Split screen */
.split{position:absolute;top:0;width:100%;height:100%}
.split .half{position:absolute;top:160px;width:500px;height:890px;border-radius:26px;overflow:hidden;
  border:1px solid rgba(255,255,255,.07);box-shadow:0 30px 60px rgba(0,0,0,.6)}
.split .half img{width:100%;height:100%;object-fit:cover;object-position:top}
.split .left{left:-520px}
.split .right{right:-520px}

/* ===== TEXT OVERLAY ===== */
.text-band{position:absolute;bottom:180px;width:100%;padding:20px 0;
  background:linear-gradient(to right,transparent,rgba(6,6,8,.95) 15%,rgba(6,6,8,.95) 85%,transparent);
  text-align:center}
.text-band .label{font-size:58px;font-weight:900;color:#FFD60A;letter-spacing:-1px;
  text-shadow:0 3px 20px rgba(0,0,0,.9),0 0 30px rgba(255,214,10,.15);
  display:inline-block}

/* ===== CTA (scene 7) ===== */
#s7 .cta-big{position:absolute;left:50%;top:500px;transform:translateX(-50%);font-size:180px;font-weight:900;color:#FFD60A;
  text-shadow:0 6px 40px rgba(0,0,0,.9),0 0 50px rgba(255,214,10,.2);opacity:0}
#s7 .cta-sub{position:absolute;left:50%;top:700px;transform:translateX(-50%);font-size:56px;font-weight:700;color:#fff;opacity:0;letter-spacing:3px;text-transform:uppercase}
#s7 .cta-btn{position:absolute;left:50%;top:880px;transform:translateX(-50%);
  background:#0A84FF;color:#fff;font-size:54px;font-weight:900;padding:28px 80px;border-radius:20px;
  box-shadow:0 20px 50px rgba(10,132,255,.4),0 0 30px rgba(10,132,255,.2);opacity:0;letter-spacing:2px}

/* ===== PROGRESS BAR ===== */
#progress{position:absolute;top:0;left:0;height:7px;background:linear-gradient(90deg,#0A84FF,#4AA9FF);
  border-radius:0 4px 4px 0;box-shadow:0 0 15px rgba(10,132,255,.5);z-index:99}

/* ===== SYNC NOTIFICATION ===== */
#notif{position:absolute;left:-800px;top:1100px;width:750px;height:140px;background:rgba(28,28,38,.95);
  border-radius:20px;border-left:6px solid #0A84FF;padding:20px 30px;display:flex;align-items:center;gap:20px;
  box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 30px rgba(10,132,255,.1);z-index:50;backdrop-filter:blur(10px)}
#notif .icon{width:64px;height:64px;background:#0A84FF;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:36px;color:#fff;font-weight:900;flex-shrink:0}
#notif .txt{flex:1}
#notif .t1{font-size:38px;font-weight:900;color:#fff}
#notif .t2{font-size:30px;color:rgba(255,255,255,.5);margin-top:4px}

/* ===== ANIMATION CONTROLS ===== */
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(120px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes slideUpPC{from{opacity:0;transform:translateX(-50%) translateY(80px) scale(.92)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes textIn{from{opacity:0;transform:translateY(60px) scale(.7)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes phoneIn{from{opacity:0;transform:translateX(-50%) translateY(200px) rotateX(15deg) scale(.85)}to{opacity:1;transform:translateX(-50%) translateY(0) rotateX(2deg) scale(1)}}
@keyframes barGrow{from{width:0}to{width:400px}}
@keyframes ctaIn{from{opacity:0;transform:translateX(-50%) scale(.5)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes btnPulse{0%,100%{box-shadow:0 20px 50px rgba(10,132,255,.4),0 0 30px rgba(10,132,255,.2)}50%{box-shadow:0 20px 60px rgba(10,132,255,.6),0 0 50px rgba(10,132,255,.35)}}
@keyframes notifFly{from{left:-800px;opacity:0}10%{opacity:1}to{left:165px;opacity:1}}
@keyframes floatCell{0%,100%{transform:translateX(-50%) rotateX(1deg)}50%{transform:translateX(-50%) rotateX(0deg) translateY(-8px)}}
@keyframes splitL{from{left:-520px;opacity:0}to{left:20px;opacity:1}}
@keyframes splitR{from{right:-520px;opacity:0}to{right:20px;opacity:1}}

/* staggered letter helpers */
.stag-0{animation-delay:0s}
.stag-1{animation-delay:.04s}
.stag-2{animation-delay:.08s}
.stag-3{animation-delay:.12s}
.stag-4{animation-delay:.16s}
.stag-5{animation-delay:.2s}
.stag-6{animation-delay:.24s}
.stag-7{animation-delay:.28s}
</style>
</head>
<body>
<div id="stage">
  <div class="mesh"></div>
  <div id="progress" style="width:0%"></div>

  <!-- particles -->
  <div id="particles"></div>

  <!-- SCENE 0: HOOK -->
  <div class="scene" id="s0">
    <div class="hook-line h1" id="h1"></div>
    <div class="hook-line h2" id="h2"></div>
    <div class="hook-line h3" id="h3"></div>
    <div class="accent-bar" id="ab"></div>
    <div class="hook-line hsub" id="hsub">notas · listas · tarefas · pastas</div>
    <div class="phone" id="hook-phone"><img src="tela-demo.png"></div>
  </div>

  <!-- SCENE 1-4: APP (genérico, troca o screenshot) -->
  <div class="scene" id="s1"><div class="app-container" id="ac1"><img id="img1" src="tela-demo.png"></div>
    <div class="text-band"><div class="label" id="lbl1"></div></div></div>
  <div class="scene" id="s2"><div class="app-container" id="ac2"><img id="img2" src="tela-demo.png"></div>
    <div class="text-band"><div class="label" id="lbl2"></div></div></div>
  <div class="scene" id="s3"><div class="app-container" id="ac3"><img id="img3" src="tela-demo.png"></div>
    <div class="text-band"><div class="label" id="lbl3"></div></div></div>
  <div class="scene" id="s4"><div class="app-container" id="ac4"><img id="img4" src="tela-demo.png"></div>
    <div class="text-band"><div class="label" id="lbl4"></div></div></div>

  <!-- SCENE 5: IA -->
  <div class="scene" id="s5"><div class="app-container" id="ac5"><img id="img5" src="tela-demo.png"></div>
    <div class="text-band"><div class="label" id="lbl5"></div></div></div>

  <!-- SCENE 6: SYNC (split screen) -->
  <div class="scene" id="s6">
    <div class="split">
      <div class="half left" id="spl"><img src="tela-demo.png"></div>
      <div class="half right" id="spr"><img src="teste-ol-final.png"></div>
    </div>
    <div id="notif">
      <div class="icon">✓</div>
      <div class="txt"><div class="t1">Reunião de segunda</div><div class="t2">sincronizada no PC</div></div>
    </div>
    <div class="text-band"><div class="label" id="lbl6">PC = CELULAR</div></div>
  </div>

  <!-- SCENE 7: CTA -->
  <div class="scene" id="s7">
    <div class="cta-big" id="ctab">GRÁTIS</div>
    <div class="cta-sub" id="ctas">PC + CELULAR · EM PORTUGUÊS</div>
    <div class="cta-btn" id="ctabtn">BAIXE AGORA</div>
  </div>
</div>

<script>
// Staggered letters para o hook
function stagger(el, text, baseDelay) {
  el.innerHTML = '';
  [...text].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? '\u00A0' : ch;
    s.style.animationDelay = (baseDelay + i * 0.035) + 's';
    el.appendChild(s);
  });
}
stagger(document.getElementById('h1'), 'PARE DE USAR', 0);
stagger(document.getElementById('h2'), '4 APPS', 0.35);
stagger(document.getElementById('h3'), 'DIFERENTES', 0.6);

// Partículas
const parts = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.top = Math.random() * 100 + '%';
  p.style.opacity = .3 + Math.random() * .4;
  p.style.animation = `drift${1 + (i % 2)} ${(8 + Math.random() * 8)}s ease-in-out infinite alternate`;
  p.style.animationDelay = (Math.random() * 5) + 's';
  p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
  parts.appendChild(p);
}

// Labels
const labels = ['TUDO EM 1 LUGAR','EDITOR DE VERDADE','ALARME QUE TOCA','E AINDA TEM IA','PC = CELULAR','GRÁTIS · SEGURO'];
[1,2,3,4,5].forEach(i => { document.getElementById('lbl' + i).textContent = labels[i-1]; });

// Timeline (em segundos)
const scenes = [
  { id:'s0', start:0,    dur:3.7, img:null },
  { id:'s1', start:3.7,  dur:6.4, img:'tela-demo.png' },
  { id:'s2', start:10.1, dur:5.2, img:'tela-demo.png' },
  { id:'s3', start:15.3, dur:4.5, img:'tela-demo.png' },
  { id:'s4', start:19.8, dur:6.1, img:'tela-demo.png' },
  { id:'s5', start:25.9, dur:5.0, img:null },  // split screen
  { id:'s6', start:30.9, dur:4.6, img:null },
  { id:'s7', start:35.5, dur:4.9, img:null },
];
// Note: s5 is the IA shot (uses app-container), s6 is split screen, s7 is CTA
// Actually let me re-arrange: s1-s4 are app shots, s5 is IA, s6 is sync (split), s7 is CTA
// I have s1-s5 as app containers and s6 as split. Let me fix the mapping.

let currentScene = -1;
const total = 40.4;

function activate(n) {
  document.querySelectorAll('.scene').forEach((s, i) => {
    if (i === n) { s.classList.add('active'); s.style.opacity = 1; }
    else { s.classList.remove('active'); s.style.opacity = 0; }
  });
  // reset animations
  const scene = document.getElementById('s' + n);
  if (!scene) return;
  scene.querySelectorAll('*').forEach(el => {
    el.style.animation = 'none';
    void el.offsetHeight; // reflow
  });

  switch(n) {
    case 0:
      scene.querySelector('#h1').querySelectorAll('span').forEach((s,i) => {
        s.style.animation = `letterIn .6s cubic-bezier(.34,1.56,.64,1) ${0 + i * .035}s forwards`;
      });
      scene.querySelector('#h2').querySelectorAll('span').forEach((s,i) => {
        s.style.animation = `letterIn .6s cubic-bezier(.34,1.56,.64,1) ${.35 + i * .04}s forwards`;
      });
      scene.querySelector('#h3').querySelectorAll('span').forEach((s,i) => {
        s.style.animation = `letterIn .6s cubic-bezier(.34,1.56,.64,1) ${.6 + i * .035}s forwards`;
      });
      scene.querySelector('#ab').style.animation = 'barGrow .5s cubic-bezier(.22,1,.36,1) .3s forwards';
      scene.querySelector('#hsub').style.animation = 'textIn .4s ease-out .9s forwards';
      scene.querySelector('#hook-phone').style.animation = 'phoneIn .7s cubic-bezier(.22,1,.36,1) .5s forwards';
      break;
    case 1: case 2: case 3: case 4: case 5:
      const ac = scene.querySelector('.app-container');
      const lbl = scene.querySelector('.label');
      if (ac) ac.style.animation = 'slideUp .5s cubic-bezier(.22,1,.36,1) forwards';
      if (lbl) {
        lbl.style.animation = 'textIn .4s cubic-bezier(.22,1,.36,1) .15s forwards';
        lbl.style.opacity = '0';
      }
      // floating
      if (ac) {
        setTimeout(() => { ac.style.animation = 'floatCell 3s ease-in-out infinite alternate'; }, 500);
      }
      break;
    case 6: // split screen
      const sl = document.getElementById('spl');
      const sr = document.getElementById('spr');
      const nt = document.getElementById('notif');
      const l6 = document.getElementById('lbl6');
      if (sl) sl.style.animation = 'splitL .6s cubic-bezier(.22,1,.36,1) .1s forwards';
      if (sr) sr.style.animation = 'splitR .6s cubic-bezier(.22,1,.36,1) .2s forwards';
      if (nt) nt.style.animation = 'notifFly .8s cubic-bezier(.22,1,.36,1) .8s forwards';
      if (l6) { l6.style.animation = 'textIn .4s ease-out .15s forwards'; l6.style.opacity = '0'; }
      break;
    case 7: // CTA
      const ctb = document.getElementById('ctab');
      const cts = document.getElementById('ctas');
      const cbtn = document.getElementById('ctabtn');
      if (ctb) ctb.style.animation = 'ctaIn .5s cubic-bezier(.34,1.56,.64,1) 0s forwards';
      if (cts) cts.style.animation = 'textIn .4s ease-out .3s forwards';
      if (cbtn) {
        cbtn.style.animation = 'ctaIn .5s cubic-bezier(.34,1.56,.64,1) .15s forwards, btnPulse 1.5s ease-in-out .8s infinite';
      }
      break;
  }
}

// Frame capture system
let frameCount = 0;
const fps = 30;

function tick(t) {
  const time = t / 1000;
  // progress bar
  document.getElementById('progress').style.width = Math.min(100, (time / total) * 100) + '%';

  // scene switching
  let scn = 0;
  for (let i = 0; i < scenes.length; i++) {
    if (time >= scenes[i].start && time < scenes[i].start + scenes[i].dur) { scn = i; break; }
    if (time >= scenes[i].start) scn = i;
  }
  if (scn !== currentScene) { currentScene = scn; activate(scn); }
}
</script>
</body>
</html>
