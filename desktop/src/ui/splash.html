<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Simple Notes Pro</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#050506;overflow:hidden;user-select:none;
    font-family:'Segoe UI',system-ui,sans-serif;color:#fff}
  .splash{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
  .logo{width:72px;height:72px;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(10,132,255,.35);
    animation:pulseLogo 2s ease-in-out infinite}
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  @keyframes pulseLogo{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .nome{font-size:1.15rem;font-weight:700;letter-spacing:.3px}
  .status{font-size:.78rem;color:#8E8E93;min-height:1.1em;text-align:center}
  .barra{width:220px;height:5px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden}
  .barra i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#0A84FF,#409CFF);
    border-radius:999px;transition:width .25s ease}
  .barra.indeterminada i{width:40%;animation:desliza 1.1s ease-in-out infinite alternate}
  @keyframes desliza{from{margin-left:0}to{margin-left:60%}}
</style>
</head>
<body>
  <div class="splash">
    <div class="logo"><img src="../shell/icone.png" alt=""></div>
    <div class="nome">Simple Notes Pro</div>
    <div class="status" id="status">Carregando…</div>
    <div class="barra indeterminada" id="barra"><i id="fill"></i></div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('splash:status', (_e, { texto, progresso }) => {
      const s = document.getElementById('status');
      const barra = document.getElementById('barra');
      const fill = document.getElementById('fill');
      if (texto && s) s.textContent = texto;
      if (barra && fill) {
        if (progresso == null) { barra.classList.add('indeterminada'); fill.style.width = '40%'; }
        else { barra.classList.remove('indeterminada'); fill.style.width = Math.round(progresso) + '%'; }
      }
    });
  </script>
</body>
</html>
